<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Maria Auxiliadora · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A33;
    --ink-soft:#4A6572;
    --bg:#E4E7E4;
    --surface:#FBFAF6;
    --surface-2:#F1EEE4;
    --border:#C7CBC2;
    --border-strong:#9AA39A;
    --crate:#B98A4E;
    --crate-light:#EFE1C8;
    --amber:#C97C1F;
    --amber-bg:#F5E3C6;
    --green:#3B7357;
    --green-bg:#DCEBE2;
    --red:#A83A2E;
    --red-bg:#F3DCD8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{max-width:820px; margin:0 auto; padding:0 16px 80px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 4px 16px; border-bottom:3px solid var(--ink);
    margin-bottom:20px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; background:var(--surface); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px;
    border-radius:6px; overflow:hidden; flex-shrink:0;
    box-shadow:0 2px 6px rgba(27,42,51,.14), 0 1px 2px rgba(27,42,51,.10);
  }
  .brand-mark img{width:100%; height:100%; object-fit:contain;}
  .brand-name{font-size:19px; font-weight:600;}
  .role-card-logo{width:64px; height:64px; object-fit:contain; display:block; flex-shrink:0;
    filter:drop-shadow(0 3px 5px rgba(27,42,51,.18));}
  .login-logo{width:64px; height:64px; object-fit:contain; margin-bottom:10px;
    filter:drop-shadow(0 3px 5px rgba(27,42,51,.18));}
  .role-pill{
    font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:10px;
  }
  .role-pill-logo{
    width:26px; height:26px; object-fit:contain; border-radius:4px;
    filter:drop-shadow(0 1px 3px rgba(27,42,51,.18));
  }
  .switch-link{
    background:none; border:none; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; font-size:12px; font-family:'Inter',sans-serif; padding:0;
  }
  .switch-link:hover{color:var(--ink);}

  .select-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:8px;}
  @media (max-width:520px){ .select-grid{grid-template-columns:1fr;} }
  .role-card{
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:8px; padding:20px 18px; cursor:pointer; text-align:left;
    transition:border-color .15s, transform .15s, box-shadow .15s;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    box-shadow:0 1px 3px rgba(27,42,51,.08), 0 1px 2px rgba(27,42,51,.05);
  }
  .role-card:hover{
    border-color:var(--ink); transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(27,42,51,.14), 0 3px 8px rgba(27,42,51,.08);
  }
  .role-card-text{flex:1; min-width:0;}
  .role-card .tag{
    display:inline-block; font-size:11px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--crate); background:var(--crate-light);
    padding:2px 8px; border-radius:3px; margin-bottom:10px;
  }
  .role-card h3{margin:0 0 4px; font-family:'Oswald',sans-serif; font-size:20px; letter-spacing:.02em;}
  .role-card p{margin:0; font-size:13px; color:var(--ink-soft);}
  .role-card.empresa .tag{color:var(--ink); background:var(--surface-2);}

  .day-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-2); border:1px dashed var(--border-strong);
    border-radius:5px; padding:10px 14px; margin-bottom:22px; font-size:13px;
  }
  .day-banner b{color:var(--ink);}

  .search-sticky{
    display:flex; gap:8px; position:sticky; top:0; z-index:15;
    background:var(--bg); margin:0 -16px; padding:12px 16px 14px;
    border-bottom:1px solid var(--border);
    box-shadow:0 6px 12px -6px rgba(27,42,51,.15);
  }

  .cat-section{margin-bottom:24px;}
  .cat-label{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--crate); color:#fff; font-family:'Oswald',sans-serif;
    font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    padding:6px 12px 6px 10px; border-radius:0 4px 4px 0;
    position:relative; left:-1px; margin-bottom:10px;
  }
  .cat-label::before{
    content:''; width:6px; height:6px; background:#fff; border-radius:50%; opacity:.85;
  }
  .product-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:5px; padding:10px 14px; margin-bottom:8px;
    box-shadow:0 1px 2px rgba(27,42,51,.05);
    transition:box-shadow .15s;
  }
  .product-row:hover{box-shadow:0 3px 8px rgba(27,42,51,.09);}
  .product-info p{margin:0; font-size:14px; font-weight:500;}
  .product-info span{font-size:12px; color:var(--ink-soft);}
  .qty-control{display:flex; align-items:center; gap:6px;}
  .qty-control button{
    width:28px; height:28px; border-radius:4px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:16px; cursor:pointer; line-height:1;
  }
  .qty-control button:active{transform:scale(.95);}
  .qty-control input{
    width:48px; text-align:center; border:1px solid var(--border-strong);
    border-radius:4px; height:28px; font-family:'JetBrains Mono',monospace; font-size:14px;
  }
  .presentation-select{
    appearance:none; -webkit-appearance:none;
    background:var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%234A6572'/></svg>") no-repeat right 9px center;
    border:1px solid var(--border-strong); border-radius:4px;
    height:28px; padding:0 22px 0 9px; font-size:12px; font-family:'Inter',sans-serif;
    color:var(--ink); cursor:pointer;
  }
  .presentation-select.edit{background-color:var(--surface);}

  .order-footer{
    position:sticky; bottom:0; background:var(--surface); border-top:2px solid var(--ink);
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    margin:0 -16px; border-radius:0;
    box-shadow:0 -6px 14px -6px rgba(27,42,51,.16);
  }
  .order-footer .count{font-size:13px; color:var(--ink-soft);}
  .order-footer .count b{color:var(--ink); font-family:'JetBrains Mono',monospace;}
  .btn-primary{
    background:var(--ink); color:var(--surface); border:none; border-radius:5px;
    padding:11px 20px; font-size:14px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif;
    box-shadow:0 3px 8px rgba(27,42,51,.25);
    transition:box-shadow .15s, transform .1s;
  }
  .btn-primary:hover{background:#0f1b21; box-shadow:0 5px 14px rgba(27,42,51,.32); transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}
  .btn-primary:disabled{background:var(--border-strong); cursor:not-allowed; box-shadow:none; transform:none;}

  .section-title{
    font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:.05em;
    text-transform:uppercase; color:var(--ink-soft); margin:30px 0 12px;
    border-bottom:1px solid var(--border); padding-bottom:6px;
  }
  .order-card{
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    margin-bottom:10px; overflow:hidden;
    box-shadow:0 2px 6px rgba(27,42,51,.07), 0 1px 2px rgba(27,42,51,.05);
    transition:box-shadow .15s;
  }
  .order-card:hover{box-shadow:0 6px 16px rgba(27,42,51,.12), 0 2px 4px rgba(27,42,51,.06);}
  .order-card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; cursor:pointer; gap:10px;
  }
  .order-meta{display:flex; flex-direction:column; gap:2px;}
  .order-code{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .order-title{font-size:14px; font-weight:600;}
  .order-sub{font-size:12px; color:var(--ink-soft);}

  .stamp{
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; padding:5px 11px; border-radius:20px; border:1.5px solid;
    white-space:nowrap;
    box-shadow:0 1px 3px rgba(27,42,51,.08);
  }
  .stamp.pendiente{color:var(--amber); border-color:var(--amber); background:var(--amber-bg);}
  .stamp.preparado{color:var(--ink-soft); border-color:var(--border-strong); background:var(--surface-2);}
  .stamp.enviado{color:var(--green); border-color:var(--green); background:var(--green-bg);}
  .stamp.pop{animation:stampPop .3s ease;}
  @keyframes stampPop{0%{transform:scale(1.5) rotate(-8deg); opacity:0;} 100%{transform:scale(1) rotate(-4deg); opacity:1;}}

  .order-detail{border-top:1px solid var(--border); padding:14px; background:var(--surface-2);}
  .detail-cat{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--crate); margin:12px 0 6px;}
  .detail-cat:first-child{margin-top:0;}
  .detail-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .detail-row:last-child{border-bottom:none;}
  .marked-for-delete{opacity:.5; background:var(--red-bg);}
  .marked-for-delete input{text-decoration:line-through;}
  .status-row{display:flex; gap:8px; margin:14px 0 10px; flex-wrap:wrap;}
  .status-btn{
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
    padding:7px 13px; border-radius:20px; border:1.5px solid var(--border-strong);
    background:var(--surface); cursor:pointer; color:var(--ink-soft);
  }
  .status-btn.active.pendiente{color:var(--amber); border-color:var(--amber); background:var(--amber-bg);}
  .status-btn.active.preparado{color:var(--ink); border-color:var(--ink-soft); background:var(--surface-2);}
  .status-btn.active.enviado{color:var(--green); border-color:var(--green); background:var(--green-bg);}
  .btn-secondary{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:5px;
    padding:8px 14px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
    box-shadow:0 1px 3px rgba(27,42,51,.08);
    transition:box-shadow .15s, transform .1s;
  }
  .btn-secondary:hover{box-shadow:0 3px 8px rgba(27,42,51,.12); transform:translateY(-1px);}

  .filter-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filter-tab{
    font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--border-strong);
    background:var(--surface); cursor:pointer; color:var(--ink-soft);
  }
  .filter-tab.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}

  .view-tabs{display:flex; gap:0; margin-bottom:20px; border-bottom:2px solid var(--ink);}
  .view-tab{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
    padding:9px 16px; border:none; background:none; cursor:pointer; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .view-tab.active{color:var(--ink); border-bottom-color:var(--ink);}

  .price-tag{font-size:12px; color:var(--crate); font-weight:600; font-family:'JetBrains Mono',monospace;}
  .price-input{
    width:76px; text-align:right; border:1px solid var(--border-strong); border-radius:4px;
    height:30px; padding:0 8px; font-family:'JetBrains Mono',monospace; font-size:13px;
  }
  .price-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:5px;
    padding:9px 14px; margin-bottom:8px;
    box-shadow:0 1px 2px rgba(27,42,51,.05);
    transition:box-shadow .15s;
  }
  .price-row:hover{box-shadow:0 3px 8px rgba(27,42,51,.09);}
  .price-row .product-info span{color:var(--ink-soft);}
  .product-photo-thumb{
    width:44px; height:44px; border-radius:6px; overflow:hidden; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
  }
  .product-photo-thumb img{width:100%; height:100%; object-fit:cover;}
  .product-photo-placeholder{font-size:16px; opacity:.4;}
  .stock-input{
    width:60px; text-align:right; border:1px solid var(--border-strong); border-radius:4px;
    height:30px; padding:0 8px; font-family:'JetBrains Mono',monospace; font-size:13px;
  }
  .field-label{font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:2px;}
  .delete-btn{
    width:30px; height:30px; border-radius:4px; border:1px solid var(--red);
    background:var(--red-bg); color:var(--red); font-size:15px; cursor:pointer; line-height:1;
  }
  .delete-btn:hover{background:var(--red); color:#fff;}
  .order-total{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink); font-weight:600;}
  .detail-total{
    display:flex; justify-content:space-between; padding-top:10px; margin-top:8px;
    border-top:1.5px solid var(--ink); font-weight:600; font-size:13px;
  }

  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}
  .login-box{
    max-width:320px; margin:26px auto 0; text-align:center;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:28px 26px 24px;
    box-shadow:0 12px 28px rgba(27,42,51,.12), 0 3px 8px rgba(27,42,51,.07);
  }
  .login-box label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin:0 0 4px; text-align:left;}
  .login-box input{
    width:100%; border:1px solid var(--border-strong); border-radius:5px;
    height:38px; padding:0 12px; font-family:'Inter',sans-serif; font-size:14px; margin-bottom:14px;
  }
  .login-error{color:var(--red); font-size:12px; margin-top:2px; display:none;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--surface); padding:11px 20px; border-radius:6px;
    font-size:13px; z-index:50; opacity:0; transition:opacity .25s;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;}

  .print-btn{
    width:32px; height:32px; border-radius:4px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:14px; cursor:pointer; line-height:1;
    box-shadow:0 1px 3px rgba(27,42,51,.08);
  }
  .print-btn:hover{background:var(--surface-2);}

  #printArea{display:none;}
  .ticket{width:280px; margin:0 auto; font-family:'JetBrains Mono',monospace; font-size:12px; color:#000;}
  .ticket-header{text-align:center; margin-bottom:8px;}
  .ticket-brand{font-weight:700; font-size:14px; margin-bottom:4px; letter-spacing:.04em;}
  .ticket-sep{white-space:pre; margin:6px 0;}
  .ticket-cat{font-weight:700; margin:8px 0 3px; text-transform:uppercase; font-size:11px;}
  .ticket-line{display:flex; justify-content:space-between; gap:8px; padding:1px 0;}
  .ticket-total{font-weight:700; font-size:13px; margin-top:4px; border-top:1px dashed #000; padding-top:4px;}
  .ticket-footer{text-align:center; margin-top:12px; font-size:10px;}

  .page-doc{width:100%; max-width:900px; margin:0 auto; font-family:'Inter',sans-serif; color:#000; padding:20px;}
  .page-header{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #000; padding-bottom:12px; margin-bottom:14px;}
  .page-brand{font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; letter-spacing:.03em;}
  .page-sub{font-size:13px; color:#444;}
  .page-meta{text-align:right; font-size:12px; line-height:1.7;}
  .page-info{font-size:13px; margin-bottom:16px; display:flex; gap:28px;}
  .page-table{width:100%; border-collapse:collapse; font-size:12px;}
  .page-table th, .page-table td{border:1px solid #999; padding:6px 8px; text-align:left;}
  .page-table thead{background:#eee;}
  .page-footer{margin-top:16px; font-size:11px; color:#666; text-align:right;}

  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script type="module">
import * as XLSX from 'https://esm.sh/xlsx@0.18.5';
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ======================================================================

   2. Ejecuta supabase-schema.sql en el SQL Editor de tu proyecto
   3. Ve a Settings -> API y copia estos dos valores
   ====================================================================== */
const SUPABASE_URL = 'https://bgqxhntciilhzgacjktv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nab36GmBiDr2Nt7lyRQ_Pg_JySTHj2X';

const CONFIGURED = !SUPABASE_URL.includes('PEGA_AQUI') && !SUPABASE_ANON_KEY.includes('PEGA_AQUI') && SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 10;

async function storageGet(key, shared){
  try{
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  try{ await window.storage.set(key, JSON.stringify(value), shared); }
  catch(e){ /* preferencia de dispositivo, no crítico */ }
}

    return item;
  });
  if(needsMigration) await supabase.from('products').upsert(migrated);
  return migrated;
}

async function uploadProductPhoto(productId, file){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${productId}-${Date.now()}.${ext}`;
  const {error: uploadError} = await supabase.storage.from('product-photos').upload(path, file, {upsert:true});
  if(uploadError){ showToast('No se pudo subir la foto'); return null; }
  const {data} = supabase.storage.from('product-photos').getPublicUrl(path);
  const url = data ? data.publicUrl : null;
  if(!url){ showToast('No se pudo obtener el enlace de la foto'); return null; }
  const {error: updateError} = await supabase.from('products').update({photo:url}).eq('id', productId);
  if(updateError){ showToast('No se pudo guardar la foto en el producto'); return null; }
  return url;
}

function showToast(msg){

function todayName(){
  const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  return days[new Date().getDay()];
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', {day:'2-digit', month:'short', year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}
function fmtMoney(n){
  return '$' + (Number(n)||0).toFixed(2);
}

const TIER_PRESENTATIONS = ['Unidad','Fardo','Caja','Quintal'];
function getPriceForPresentation(product, presentation){
  if(!product) return 0;
  const tierMap = {
    'Unidad': product.priceUnidad,
    'Fardo': product.priceFardo,
    'Caja': product.priceCaja,
    'Quintal': product.priceQuintal
  };
  const val = tierMap[presentation];
  return (val!==undefined && val!==null && val!=='') ? Number(val) : Number(product.price||0);
}

function groupByCategory(items, productList){
  const map = {};
  items.forEach(it=>{
    const prod = productList.find(p=>p.id===it.productId);
    if(!prod) return;
    if(!map[prod.category]) map[prod.category] = [];
    const price = it.price!==undefined ? it.price : prod.price;
    map[prod.category].push({...it, name:prod.name, unit:prod.unit, presentation: it.presentation || 'Unidad', price, subtotal: price*it.qty});
  });
  return map;
}

function orderTotal(order){
  return order.items.reduce((sum,it)=>{
    const prod = products.find(p=>p.id===it.productId);
    const price = it.price!==undefined ? it.price : (prod ? prod.price : 0);
    return sum + price*it.qty;
  }, 0);
}

function activeCategories(){
  const extra = [...new Set(products.map(p=>p.category).filter(c=>c && !CATEGORY_ORDER.includes(c)))];
  return [...CATEGORY_ORDER, ...extra];
}

async function adjustStockForItemChanges(oldItems, newItems){
  const oldMap = {}; oldItems.forEach(it=>{ oldMap[it.productId] = it.qty; });
  const newMap = {}; newItems.forEach(it=>{ newMap[it.productId] = it.qty; });
  const ids = new Set([...Object.keys(oldMap), ...Object.keys(newMap)]);
  let changed = false;
  const updated = products.map(p=>{
    if(!ids.has(p.id)) return p;
    const delta = (newMap[p.id]||0) - (oldMap[p.id]||0);
    if(delta===0) return p;
    changed = true;
    return {...p, stock: Math.max(0, p.stock - delta)};
  });
  if(changed) await saveProductsBulk(updated);
}

    if(user===entity.username.toLowerCase() && pass===entity.password){

  document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });

function updateItemCount(){
  const n = Object.values(draftQty).filter(v=>v>0).length;
  const el = document.getElementById('itemCount');
  if(el) el.textContent = n;
  const total = Object.entries(draftQty).reduce((sum,[pid,qty])=>{
    if(qty<=0) return sum;
    const prod = products.find(p=>p.id===pid);
    if(!prod) return sum;
    return sum + getPriceForPresentation(prod, draftPresentation[pid]||'Unidad')*qty;
  }, 0);
  const totalEl = document.getElementById('orderEstimate');
  if(totalEl) totalEl.textContent = fmtMoney(total);
  const summaryEl = document.getElementById('selectionSummary');
  if(summaryEl) summaryEl.innerHTML = buildSelectionSummaryHTML();
}

      productSearch = searchInput.value;
      const cursorPos = searchInput.selectionStart;
      render();
      const newInput = document.getElementById('productSearch');
      if(newInput){
        newInput.focus();
        newInput.setSelectionRange(cursorPos, cursorPos);
      }
    });
  }
  const clearBtn = document.getElementById('clearSearch');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ productSearch=''; render(); });

  document.querySelectorAll('.qty-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const v = Math.max(0, parseInt(inp.value)||0);
      draftQty[inp.dataset.pid] = v;
      updateItemCount();
    });
  });
  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.dataset.pid;
      const cur = draftQty[pid]||0;
      const next = btn.dataset.act==='inc' ? cur+1 : Math.max(0,cur-1);
      draftQty[pid] = next;
      const inp = document.querySelector(`.qty-input[data-pid="${pid}"]`);
      if(inp) inp.value = next;
      updateItemCount();
    });
  });
  document.querySelectorAll('.presentation-select[data-pid]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      draftPresentation[sel.dataset.pid] = sel.value;
      const prod = products.find(p=>p.id===sel.dataset.pid);
      const priceTag = document.getElementById(`priceTag-${sel.dataset.pid}`);
      if(priceTag && prod) priceTag.textContent = fmtMoney(getPriceForPresentation(prod, sel.value));
      updateItemCount();
    });
  });
  const summaryEl = document.getElementById('selectionSummary');
  if(summaryEl){
    summaryEl.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-remove-selected]');
      if(!btn) return;
      const pid = btn.dataset.removeSelected;
      draftQty[pid] = 0;
      const inp = document.querySelector(`.qty-input[data-pid="${pid}"]`);
      if(inp) inp.value = 0;
      updateItemCount();
    });
  }
  document.getElementById('submitOrder').addEventListener('click', submitOrder);
  bindOrderCardToggles();
  updateItemCount();
}

async function submitOrder(){
  const items = Object.entries(draftQty).filter(([_,v])=>v>0).map(([productId,qty])=>{
    const prod = products.find(p=>p.id===productId);
    const presentation = draftPresentation[productId] || 'Unidad';
    return {productId, qty, presentation, price: getPriceForPresentation(prod, presentation)};
  });
  if(items.length===0){ showToast('Agrega al menos un producto.'); return; }
  const btn = document.getElementById('submitOrder');
  btn.disabled = true; btn.textContent = 'Enviando...';

  const latest = await loadOrders();
  const todayStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const seq = latest.filter(o=>o.sucursalId===role.id && o.id.includes(todayStr)).length + 1;
  const order = {
    id: `${role.code}-${todayStr}-${String(seq).padStart(3,'0')}`,
    sucursalId: role.id,
    sucursalName: role.name,
    createdAt: new Date().toISOString(),
    items,
    status: 'Pendiente'
  };
  const ok = await insertOrder(order);
  if(!ok){ btn.disabled = false; btn.textContent = 'Enviar pedido'; return; }
  orders = await loadOrders();
  draftQty = {};
  draftPresentation = {};
  showToast(`Pedido ${order.id} enviado a Empresa 1`);
  render();
}

function renderResumenView(){
  const stats = SUCURSALES.map(s=>{
    const sucursalOrders = orders.filter(o=>o.sucursalId===s.id);
    const totalMoney = sucursalOrders.reduce((sum,o)=>sum+orderTotal(o), 0);
    const sucursalReturns = returns.filter(r=>r.sucursalId===s.id);
    const returnsQty = sucursalReturns.reduce((sum,r)=>sum+(r.qty||0), 0);
    const reasonCounts = {};
    sucursalReturns.forEach(r=>{ reasonCounts[r.reason] = (reasonCounts[r.reason]||0) + (r.qty||0); });
    const noHayItems = sucursalReturns.filter(r=>r.reason==='No hay').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    return {...s, orderCount:sucursalOrders.length, totalMoney, returnsCount:sucursalReturns.length, returnsQty, reasonCounts, noHayItems};
  });
  const maxMoney = Math.max(1, ...stats.map(s=>s.totalMoney));
  const maxReturns = Math.max(1, ...stats.map(s=>s.returnsQty));

  const cardsHtml = stats.map(s=>{
    const moneyPct = Math.round((s.totalMoney / maxMoney) * 100);
    const returnsPct = Math.round((s.returnsQty / maxReturns) * 100);
    const reasonsHtml = Object.keys(s.reasonCounts).length ?
      Object.entries(s.reasonCounts).map(([reason,qty])=>`
        <div class="detail-row" style="padding:4px 0; font-size:12px;">
          <span>${reason}</span><span class="mono">${qty}</span>
        </div>`).join('') :
      `<p style="font-size:12px; color:var(--ink-soft); margin:4px 0 0;">Sin devoluciones registradas.</p>`;

    const noHayHtml = s.noHayItems.length ? `
        <div class="field-label" style="margin-top:14px;">Productos marcados "No hay"</div>
        <div style="border:1px solid var(--border); border-radius:6px; overflow:hidden; margin-top:6px;">
          ${s.noHayItems.map(it=>`
            <div class="detail-row" style="padding:7px 10px; font-size:12px;">
              <span>${it.productName} <span class="order-code mono" style="font-size:10px;">· ${it.orderId}</span></span>
              <span class="mono">${it.qty} × ${fmtMoney(it.price)} = ${fmtMoney(it.qty*it.price)}</span>
            </div>`).join('')}
        </div>` : '';

    return `
      <div class="order-card" style="padding:16px;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
          <img src="${s.logo}" alt="${s.name}" style="width:40px; height:40px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(27,42,51,.15));">
          <div>
            <div class="order-title">${s.name}</div>
            <div class="order-sub">${s.orderCount} pedido${s.orderCount===1?'':'s'} · pedido asignado ${s.day}</div>
          </div>
        </div>

        <div class="field-label">Dinero pedido</div>
        <div style="display:flex; align-items:center; gap:10px; margin:4px 0 14px;">
          <div style="flex:1; background:var(--surface-2); border-radius:6px; height:14px; overflow:hidden;">
            <div style="width:${moneyPct}%; height:100%; background:var(--green); border-radius:6px;"></div>
          </div>
          <span class="mono" style="min-width:70px; text-align:right; font-weight:600;">${fmtMoney(s.totalMoney)}</span>
        </div>

        <div class="field-label">Devoluciones (productos quitados de pedidos)</div>
        <div style="display:flex; align-items:center; gap:10px; margin:4px 0 10px;">
          <div style="flex:1; background:var(--surface-2); border-radius:6px; height:14px; overflow:hidden;">
            <div style="width:${returnsPct}%; height:100%; background:var(--red);"></div>
          </div>
          <span class="mono" style="min-width:70px; text-align:right; font-weight:600;">${s.returnsQty}</span>
        </div>
        ${reasonsHtml}
        ${noHayHtml}
      </div>`;
  }).join('');

  return `
    <div class="section-title">Resumen por tienda</div>
    <p style="font-size:13px; color:var(--ink-soft); margin:-6px 0 16px;">Dinero total pedido y devoluciones (productos que se quitaron de un pedido, con su motivo).</p>
    ${cardsHtml}

    ${returns.length ? returns.map(r=>renderReturnCard(r)).join('') : `<div class="empty">No hay devoluciones registradas todavía.</div>`}
  `;
}

function bindReturnCards(){
  document.querySelectorAll('[data-toggle-return]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggleReturn;
      openReturnId = openReturnId===id ? null : id;
      render();
    });
  });
  document.querySelectorAll('[data-print-return]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{ e.stopPropagation(); await printReturnTicket(btn.dataset.printReturn); });
  });
  document.querySelectorAll('[data-delete-return]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.deleteReturn;
      const wrap = btn.parentElement;
      const original = wrap.innerHTML;
      wrap.innerHTML = `
        <span style="font-size:12px; color:var(--red);">¿Eliminar?</span>
        <button class="btn-secondary" data-confirm-delete-return="${id}">Sí</button>
        <button class="btn-secondary" data-cancel-delete-return>No</button>
      `;
      wrap.querySelector('[data-confirm-delete-return]').addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        const ok = await deleteReturnRow(id);
        if(ok){
          returns = await loadReturns();
          if(openReturnId===id) openReturnId = null;
          showToast('Devolución eliminada');
          render();
        }
      });
      wrap.querySelector('[data-cancel-delete-return]').addEventListener('click', (ev)=>{
        ev.stopPropagation();
        wrap.innerHTML = original;
        bindReturnCards();
      });
    });
  });
  document.querySelectorAll('[data-set-return-status]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.return;
      const status = btn.dataset.setReturnStatus;
      document.querySelectorAll(`[data-return="${id}"][data-set-return-status]`).forEach(b=>{
        b.classList.toggle('active', b.dataset.setReturnStatus===status);
      });
      const stamp = document.getElementById(`return-stamp-${id}`);
      if(stamp){ stamp.textContent = status; stamp.className = `stamp ${returnStatusClass(status)} pop`; }
      await updateReturnStatus(id, status);
      returns = await loadReturns();
    });
  });
  document.querySelectorAll('[data-save-return]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveReturn;
      btn.disabled = true; btn.textContent = 'Guardando...';
      const qtyInput = document.querySelector(`.edit-return-qty[data-return="${id}"]`);
      const priceInput = document.querySelector(`.edit-return-price[data-return="${id}"]`);
      const reasonSelect = document.querySelector(`.edit-return-reason[data-return="${id}"]`);
      const fields = {
        qty: Math.max(0, parseInt(qtyInput.value)||0),
        price: Math.max(0, parseFloat(priceInput.value)||0),
        reason: reasonSelect.value
      };
      const ok = await updateReturnRecord(id, fields);
      if(ok){
        returns = await loadReturns();
        showToast('Devolución actualizada');
      }
      render();
    });
  });
}

function attachProductDeleteHandlers(container){
  container.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.dataset.delete;
      const wrap = btn.parentElement;
      wrap.innerHTML = `

        <button class="btn-secondary" data-confirm-delete="${pid}">Sí</button>
        <button class="btn-secondary" data-cancel-delete="${pid}">No</button>
      `;
      wrap.querySelector('[data-confirm-delete]').addEventListener('click', async ()=>{
        await deleteProductRow(pid);
        products = await loadProducts();
        showToast('Producto eliminado');
        render();
      });
      wrap.querySelector('[data-cancel-delete]').addEventListener('click', ()=>{
        wrap.innerHTML = `<button class="delete-btn" data-delete="${pid}" title="Eliminar producto" aria-label="Eliminar producto">×</button>`;
        attachProductDeleteHandlers(wrap);
      });
    });
  });
}

function exportInventoryExcel(){
  const rows = inventory.map(r=>{
    const sucursal = SUCURSALES.find(s=>s.id===r.sucursalId);
    return {
      Sucursal: sucursal ? sucursal.name : r.sucursalId,
      Categoria: r.category,
      Producto: r.productName,
      Cantidad: r.qty,
      Actualizado: fmtDate(r.updatedAt)
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:22},{wch:16},{wch:26},{wch:10},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inventario');
  XLSX.writeFile(wb, `inventario-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportProductsExcel(){
  const rows = products.map(p=>({
    ID: p.id, Categoria: p.category, Nombre: p.name, Unidad: p.unit,
    'Precio Unidad': p.priceUnidad!==undefined ? p.priceUnidad : p.price,
    'Precio Fardo': p.priceFardo!==undefined ? p.priceFardo : p.price,
    'Precio Caja': p.priceCaja!==undefined ? p.priceCaja : p.price,
    'Precio Quintal': p.priceQuintal!==undefined ? p.priceQuintal : p.price,
    Cantidad: p.stock
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:16},{wch:26},{wch:14},{wch:13},{wch:12},{wch:11},{wch:14},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Productos');
  XLSX.writeFile(wb, `productos-${new Date().toISOString().slice(0,10)}.xlsx`);
}

async function handleImportExcel(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(rows.length===0){ showToast('El archivo no tiene filas de datos.'); return; }

    const byId = {};
    products.forEach(p=>{ byId[p.id]=p; });
    const updated = [...products];
    let updatedCount = 0, addedCount = 0, skipped = 0;

    rows.forEach((row,i)=>{
      const id = String(row.ID ?? row.Id ?? row.id ?? '').trim();
      const name = String(row.Nombre ?? row.nombre ?? '').trim();
      const category = String(row.Categoria ?? row.categoria ?? '').trim() || 'Sin categoría';
      const unit = String(row.Unidad ?? row.unidad ?? '').trim();
      const priceUnidad = Math.max(0, parseFloat(row['Precio Unidad'] ?? row.Precio ?? row.precio) || 0);
      const priceFardo = Math.max(0, parseFloat(row['Precio Fardo']) || priceUnidad);
      const priceCaja = Math.max(0, parseFloat(row['Precio Caja']) || priceUnidad);
      const priceQuintal = Math.max(0, parseFloat(row['Precio Quintal']) || priceUnidad);
      const stock = Math.max(0, parseInt(row.Cantidad ?? row.cantidad) || 0);
      if(!name){ skipped++; return; }

      if(id && byId[id]){
        const idx = updated.findIndex(p=>p.id===id);
        updated[idx] = {...updated[idx], name, category, unit: unit || updated[idx].unit,
          price:priceUnidad, priceUnidad, priceFardo, priceCaja, priceQuintal, stock};
        updatedCount++;
      } else {
        const newId = id || ('p_' + Date.now() + '_' + i);
        updated.push({id:newId, name, category, unit, price:priceUnidad, priceUnidad, priceFardo, priceCaja, priceQuintal, stock});
        addedCount++;
      }
    });

    await saveProductsBulk(updated);
    products = await loadProducts();
    showToast(`Excel importado: ${updatedCount} actualizados, ${addedCount} nuevos${skipped ? ', ' + skipped + ' omitidos' : ''}`);
    render();
  }catch(err){
    showToast('No se pudo leer el archivo. Verifica que sea un Excel válido.');
  } finally {
    e.target.value = '';
  }
}

        <div class="detail-row" data-item-row="${it.productId}">
          <span>${it.name} <span style="color:var(--ink-soft);">(${it.unit})</span></span>
          ${editable ? `
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
              <span class="price-tag" style="min-width:56px; text-align:right;">${it.presentation}</span>

              <select class="presentation-select edit edit-item-reason" data-order="${order.id}" data-pid="${it.productId}" style="display:none;">
                ${RETURN_REASONS.map(r=>`<option value="${r}">${r}</option>`).join('')}
              </select>
              <button class="delete-btn" data-delete-item="${it.productId}" data-order="${order.id}" title="Quitar producto" aria-label="Quitar producto">×</button>

          ` : `<span class="mono">${it.presentation} · ${it.qty} = ${fmtMoney(it.subtotal)}</span>`}

      return `<div class="detail-cat">${cat}</div>${rows}`;

  }

  return `
    <div class="order-card" data-card="${order.id}">
      <div class="order-card-head" data-toggle="${order.id}">
        <div class="order-meta">
          <span class="order-code mono">${order.id}</span>
          <span class="order-title">${sucursal ? sucursal.name : order.sucursalName} · ${order.items.length} productos · <span class="order-total">${fmtMoney(orderTotal(order))}</span></span>

function buildTicketHTML(order){
  const grouped = groupByCategory(order.items, products);
  const sucursal = SUCURSALES.find(s=>s.id===order.sucursalId);
  let itemsHtml = '';
  Object.keys(grouped).forEach(cat=>{
    itemsHtml += `<div class="ticket-cat">${cat}</div>`;
    grouped[cat].forEach(it=>{
      itemsHtml += `
        <div class="ticket-line"><span>${it.qty} ${it.presentation} · ${it.name}</span></div>
        <div class="ticket-line"><span>&nbsp;&nbsp;${fmtMoney(it.price)} c/u</span><span>${fmtMoney(it.subtotal)}</span></div>`;
    });
  });
  return `
    <div class="ticket">
      <div class="ticket-header">
        <div class="ticket-brand">${EMPRESA_NAME.toUpperCase()}</div>
        <div>${sucursal ? sucursal.name : order.sucursalName}</div>
        <div>Pedido ${order.id}</div>
        <div>${fmtDate(order.createdAt)}</div>
        <div>Estado: ${order.status}</div>
      </div>
      <div class="ticket-sep">--------------------------------</div>
      ${itemsHtml}
      <div class="ticket-sep">--------------------------------</div>
      <div class="ticket-line ticket-total"><span>TOTAL</span><span>${fmtMoney(orderTotal(order))}</span></div>
      <div class="ticket-footer">${order.items.length} productos · Gracias</div>
    </div>`;
}

function recalcDetailTotal(orderId){
  if(!orderId) return;
  let total = 0;
  document.querySelectorAll(`.edit-item-qty[data-order="${orderId}"]`).forEach(qtyInp=>{
    const row = qtyInp.closest('[data-item-row]');
    if(row && row.classList.contains('marked-for-delete')) return;
    const pid = qtyInp.dataset.pid;
    const priceInp = document.querySelector(`.edit-item-price[data-order="${orderId}"][data-pid="${pid}"]`);
    const qty = Math.max(0, parseInt(qtyInp.value)||0);
    const price = priceInp ? Math.max(0, parseFloat(priceInp.value)||0) : 0;
    total += qty*price;
  });
  const totalEl = document.getElementById(`detailTotal-${orderId}`);
  if(totalEl) totalEl.textContent = fmtMoney(total);
}

async function persistOrderItemEdits(orderId){
  const qtyInputs = document.querySelectorAll(`.edit-item-qty[data-order="${orderId}"]`);
  if(qtyInputs.length===0) return {changed:false};
  const latest = await loadOrders();
  const idx = latest.findIndex(o=>o.id===orderId);
  if(idx===-1) return {changed:false, error:'not-found'};
  const keptQty = {};
  qtyInputs.forEach(inp=>{
    const row = inp.closest('[data-item-row]');
    if(row && !row.classList.contains('marked-for-delete')) keptQty[inp.dataset.pid] = Math.max(1, parseInt(inp.value)||1);
  });
  const keptPrice = {};
  document.querySelectorAll(`.edit-item-price[data-order="${orderId}"]`).forEach(inp=>{
    const row = inp.closest('[data-item-row]');
    if(row && !row.classList.contains('marked-for-delete')) keptPrice[inp.dataset.pid] = Math.max(0, parseFloat(inp.value)||0);
  });
  const newItems = latest[idx].items
    .filter(it=> keptQty[it.productId]!==undefined)
    .map(it=>({...it, qty:keptQty[it.productId], price: keptPrice[it.productId]!==undefined ? keptPrice[it.productId] : it.price}));
  if(newItems.length===0) return {changed:false, error:'empty'};

  const removedRecords = [];
  document.querySelectorAll(`.edit-item-reason[data-order="${orderId}"]`).forEach(sel=>{
    const row = sel.closest('[data-item-row]');
    if(!row || !row.classList.contains('marked-for-delete')) return;
    const pid = sel.dataset.pid;
    const originalItem = latest[idx].items.find(it=>it.productId===pid);
    const prod = products.find(p=>p.id===pid);
    removedRecords.push({
      orderId, sucursalId: latest[idx].sucursalId, productId: pid,
      productName: prod ? prod.name : pid, reason: sel.value,
      qty: originalItem ? originalItem.qty : 0, price: originalItem ? originalItem.price : 0
    });
  });

  await adjustStockForItemChanges(latest[idx].items, newItems);
  products = await loadProducts();
  await replaceOrderItems(orderId, newItems);
  if(removedRecords.length>0){
    await insertReturns(removedRecords);
    returns = await loadReturns();
  }
  orders = await loadOrders();
  return {changed:true};
}

async function printOrderTicket(orderId){
  await persistOrderItemEdits(orderId);
  orders = await loadOrders();
  const order = orders.find(o=>o.id===orderId);
  if(!order){ showToast('Pedido no encontrado'); return; }
  document.getElementById('printArea').innerHTML = buildTicketHTML(order);
  window.print();
}

function bindPrintButtons(){
  document.querySelectorAll('[data-print-ticket]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{ e.stopPropagation(); await printOrderTicket(btn.dataset.printTicket); });
  });
  document.querySelectorAll('[data-print-pdf]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{ e.stopPropagation(); await printOrderFullPage(btn.dataset.printPdf); });
  });
  document.querySelectorAll('[data-delete-order]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const orderId = btn.dataset.deleteOrder;
      const wrap = btn.closest('[data-order-actions]');
      if(!wrap) return;
      const original = wrap.innerHTML;
      wrap.innerHTML = `
        <span style="font-size:12px; color:var(--red);">¿Eliminar pedido?</span>
        <button class="btn-secondary" data-confirm-delete-order="${orderId}">Sí</button>
        <button class="btn-secondary" data-cancel-delete-order>No</button>
      `;
      wrap.querySelector('[data-confirm-delete-order]').addEventListener('click', async (ev)=>{
        ev.stopPropagation();
        const ok = await deleteOrderRow(orderId);
        if(ok){
          orders = await loadOrders();
          if(openOrderId===orderId) openOrderId = null;
          showToast('Pedido eliminado');
          render();
        }
      });
      wrap.querySelector('[data-cancel-delete-order]').addEventListener('click', (ev)=>{
        ev.stopPropagation();
        wrap.innerHTML = original;
        bindPrintButtons();
      });
    });
  });
}

      const id = el.dataset.toggle;
      openOrderId = openOrderId===id ? null : id;

    });
  });
}

function bindEmpresaView(){
  document.querySelectorAll('.view-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ empresaTab = t.dataset.view; openOrderId=null; render(); });
  });

  if(empresaTab==='resumen'){ bindReturnCards(); return; }

  if(empresaTab==='inventario'){
    const exportBtn = document.getElementById('exportInventoryExcel');
    if(exportBtn) exportBtn.addEventListener('click', exportInventoryExcel);

    document.querySelectorAll('[data-inv-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.invEdit;
        const row = btn.closest('[data-inv-row]');
        if(!row) return;
        row.querySelector(`.inv-display-${id}`).style.display = 'none';
        row.querySelector('.inv-edit-qty').style.display = 'inline-block';
        row.querySelector('.inv-edit-btn').style.display = 'none';
        row.querySelector('.inv-save-btn').style.display = 'inline-block';
      });
    });

    document.querySelectorAll('[data-inv-save]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.invSave;
        const row = btn.closest('[data-inv-row]');
        if(!row) return;
        const qtyInput = row.querySelector('.inv-edit-qty');
        const qty = Math.max(0, parseInt(qtyInput.value)||0);
        btn.disabled = true; btn.textContent = 'Guardando...';
        const ok = await updateInventoryCountRow(id, qty);
        if(ok){
          inventory = await loadInventory();
          showToast('Conteo actualizado');
          render();
        } else {
          btn.disabled = false; btn.textContent = 'Guardar';
        }
      });
    });

    document.querySelectorAll('[data-inv-delete]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.invDelete;
        const wrap = btn.parentElement;
        const original = wrap.innerHTML;
        wrap.innerHTML = `
          <span style="font-size:12px; color:var(--red);">¿Eliminar?</span>
          <button class="btn-secondary" data-inv-confirm-delete="${id}">Sí</button>
          <button class="btn-secondary" data-inv-cancel-delete>No</button>
        `;
        wrap.querySelector('[data-inv-confirm-delete]').addEventListener('click', async ()=>{
          const ok = await deleteInventoryCountRow(id);
          if(ok){
            inventory = await loadInventory();
            showToast('Registro eliminado');
            render();
          }
        });
        wrap.querySelector('[data-inv-cancel-delete]').addEventListener('click', ()=>{
          wrap.innerHTML = original;
        });
      });
    });
    return;
  }

  if(empresaTab==='precios'){
    const exportBtn = document.getElementById('exportExcel');
    if(exportBtn) exportBtn.addEventListener('click', exportProductsExcel);
    const importBtn = document.getElementById('importExcelBtn');
    const importFile = document.getElementById('importExcelFile');
    if(importBtn && importFile){
      importBtn.addEventListener('click', ()=> importFile.click());
      importFile.addEventListener('change', handleImportExcel);
    }

    const saveBtn = document.getElementById('savePrices');
    if(saveBtn) saveBtn.addEventListener('click', async ()=>{
      saveBtn.disabled = true; saveBtn.textContent = 'Guardando...';
      const editedTierPrices = {};
      document.querySelectorAll('.tier-price-input[data-pid]').forEach(inp=>{
        const pid = inp.dataset.pid;
        const tier = inp.dataset.tier;
        if(!editedTierPrices[pid]) editedTierPrices[pid] = {};
        editedTierPrices[pid][tier] = Math.max(0, parseFloat(inp.value)||0);
      });
      const editedStock = {};
      document.querySelectorAll('.stock-input[data-pid]').forEach(inp=>{
        editedStock[inp.dataset.pid] = Math.max(0, parseInt(inp.value)||0);
      });
      const updated = products.map(p=>{
        const tiers = editedTierPrices[p.id] || {};
        const priceUnidad = tiers.priceUnidad!==undefined ? tiers.priceUnidad : p.priceUnidad;
        return {
          ...p,
          priceUnidad,
          priceFardo: tiers.priceFardo!==undefined ? tiers.priceFardo : p.priceFardo,
          priceCaja: tiers.priceCaja!==undefined ? tiers.priceCaja : p.priceCaja,
          priceQuintal: tiers.priceQuintal!==undefined ? tiers.priceQuintal : p.priceQuintal,
          price: priceUnidad,
          stock: editedStock[p.id]!==undefined ? editedStock[p.id] : p.stock
        };
      });
      await saveProductsBulk(updated);
      products = await loadProducts();
      showToast('Productos actualizados');
      render();
    });
    attachProductDeleteHandlers(document);

    document.querySelectorAll('[data-upload-photo]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const pid = btn.dataset.uploadPhoto;
        const fileInput = document.querySelector(`.photo-file-input[data-pid="${pid}"]`);
        if(fileInput) fileInput.click();
      });
    });
    document.querySelectorAll('.photo-file-input').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const file = inp.files[0];
        if(!file) return;
        const pid = inp.dataset.pid;
        const thumb = document.querySelector(`[data-photo-thumb="${pid}"]`);
        if(thumb) thumb.innerHTML = `<span class="product-photo-placeholder">⏳</span>`;
        const url = await uploadProductPhoto(pid, file);
        if(url){
          products = await loadProducts();
          showToast('Foto actualizada');
          render();
        } else {
          render();
        }
      });
    });
    document.querySelectorAll('[data-remove-photo]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const pid = btn.dataset.removePhoto;
        const ok = await removeProductPhoto(pid);
        if(ok){
          products = await loadProducts();
          showToast('Foto quitada');
          render();
        }
      });
    });
    return;
  }

  document.querySelectorAll('.filter-tab').forEach(t=>{
    t.addEventListener('click', ()=>{ filterSucursal = t.dataset.tab; openOrderId=null; render(); });
  });
  bindOrderCardToggles();
  bindPrintButtons();

  document.querySelectorAll('[data-delete-item]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('[data-item-row]');
      if(!row) return;
      const marked = row.classList.toggle('marked-for-delete');
      const qtyInput = row.querySelector('.edit-item-qty');
      const priceInput = row.querySelector('.edit-item-price');
      const reasonSelect = row.querySelector('.edit-item-reason');
      if(qtyInput) qtyInput.disabled = marked;
      if(priceInput) priceInput.disabled = marked;
      if(reasonSelect) reasonSelect.style.display = marked ? 'inline-block' : 'none';
      btn.textContent = marked ? '↺' : '×';
      btn.title = marked ? 'Deshacer' : 'Quitar producto';
      recalcDetailTotal(btn.dataset.order);
    });
  });

  document.querySelectorAll('.edit-item-qty, .edit-item-price').forEach(inp=>{
    inp.addEventListener('input', ()=> recalcDetailTotal(inp.dataset.order));
  });

  document.querySelectorAll('[data-save-items]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.saveItems;
      btn.disabled = true; btn.textContent = 'Guardando...';
      const result = await persistOrderItemEdits(id);
      if(result.error==='empty'){ showToast('El pedido debe tener al menos un producto.'); btn.disabled=false; btn.textContent='Guardar cambios del pedido'; return; }
      if(result.error==='not-found'){ showToast('El pedido ya no existe.'); return; }
      showToast(`Pedido ${id} actualizado y cantidad de productos ajustada`);
      render();
    });
  });

  document.querySelectorAll('[data-set-status]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.order;
      const status = btn.dataset.setStatus;
      document.querySelectorAll(`[data-order="${id}"][data-set-status]`).forEach(b=>{
        b.classList.toggle('active', b.dataset.setStatus===status);
      });
      const stamp = document.getElementById(`stamp-${id}`);
      if(stamp){
        stamp.textContent = status;
        stamp.className = `stamp ${statusClass(status)} pop`;
      }
      await updateOrderStatus(id, status);
      orders = await loadOrders();
    });
  });
}

init();
</script>
</body>
</html>
